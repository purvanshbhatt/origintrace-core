name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        # radare2, angr, libmagic and the FAISS stack are optional: the
        # pipeline degrades without them (see README), so CI installs the
        # light set. It is derived from requirements.txt to keep one source
        # of truth for the pins.
        run: |
          grep -vE '^(#|faiss-cpu|sentence-transformers|numpy|angr|bitstring|pycparser|python-magic)' requirements.txt > requirements-light.txt
          pip install -r requirements-light.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
