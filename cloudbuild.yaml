steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/origintrace-engine', '.']

  # 2. Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/origintrace-engine']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'origintrace-engine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/origintrace-engine'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'GEMINI_API_KEY=projects/$PROJECT_ID/secrets/GEMINI_API_KEY:latest'
      - '--set-env-vars'
      # gcloud splits --set-env-vars on commas; the ^@^ prefix switches the
      # delimiter to "@" so the comma-separated origin list stays one value.
      - '^@^ALLOWED_ORIGINS=https://origintrace-ui.web.app,https://origintrace-ui.firebaseapp.com,http://localhost:5173'

images:
  - 'gcr.io/$PROJECT_ID/origintrace-engine'
