steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/origintrace-engine', '.']

  # 2. Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/origintrace-engine']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'origintrace-engine'
      - '--image'
      - 'gcr.io/$PROJECT_ID/origintrace-engine'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'GEMINI_API_KEY=projects/$PROJECT_ID/secrets/GEMINI_API_KEY:latest'
      - '--set-env-vars'
      - 'ALLOWED_ORIGINS=https://origintrace-ui.web.app,http://localhost:5173,http://localhost:8080'

images:
  - 'gcr.io/$PROJECT_ID/origintrace-engine'
